name: Daily PSX Scraper



on:
  schedule:
    - cron: "0 17 * * 1-5"   # Monday–Friday at 17:00 UTC (22:00 PKT)
  workflow_dispatch:            # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run daily update
        run: python main.py --update
        # --update: scrapes new dates since last DB record, then auto-saves trade setups

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily scraper FAILED on $(date -u '+%Y-%m-%d %H:%M UTC'). Check logs above."
          # Optional: add a curl ca