name: Daily PSX Scraper



on:
  schedule:
    # Redundant attempts, not one perfectly-timed run. GitHub's scheduler
    # drops or delays cron slots by hours -- measured on this repo: +2h
    # (2026-08-26), +5h (2026-08-31), and slots dropped entirely (2026-08-27 /
    # 2026-08-28 ran only on ~8h-late catch-ups; the 08-28 catch-up then
    # failed, unalerted). `main.py --update` is idempotent and a cheap green
    # no-op when there is nothing new (freshness gate sees source-date ==
    # DB-max and passes), so extra attempts cost almost nothing -- public
    # repo, unlimited Actions minutes. ksestocks EOD data is reliably
    # complete ~19:30-20:00 PKT (refresh_manager.py's 19:00 assumption +
    # observed 19:40 PKT 2026-08-17 / <=20:15 PKT 2026-09-01). `concurrency`
    # below serialises any overlap. Schedule locked 2026-09-01 (ledger §99).
    - cron: "30 14 * * 1-5"   # 19:30 PKT -- primary attempt
    - cron: "0 17 * * 1-5"    # 22:00 PKT -- backup if 19:30 was too early or dropped
    - cron: "0 20 * * 1-5"    # 01:00 PKT -- final same-day safety net
    - cron: "0 14 * * 6"      # Sat 19:00 PKT -- catch a Friday whose weekday slots all failed
    - cron: "30 12 * * 1"     # Mon 17:30 PKT -- last-resort catch-up before health_check.py's 4-day floor
  workflow_dispatch:            # allow manual trigger from GitHub UI

concurrency:
  group: daily-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # TR-18 dead-man's-switch. Hoisted to job-level env (not left as
      # secrets.X inline in `if:`, and not a step-local env) because a
      # step's `if:` can read job-level env but not its own step-level env
      # (env for a step isn't materialized until the step runs), and GitHub
      # Actions' schema does not accept the secrets context directly inside
      # a step `if:` expression -- confirmed the hard way: the first version
      # of this workflow (secrets.HEALTHCHECKS_PING_URL != '' in `if:`)
      # passed local `yaml.safe_load()` but failed GitHub's own workflow
      # validator with zero jobs scheduled (ledger §100.5).
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ping healthchecks.io (start)
        # TR-18 dead-man's-switch, part 1 of 3. Distinguishes "job never ran"
        # (healthchecks.io sees no ping at all) from "job started but never
        # finished successfully" (a /start with no matching success). The
        # `!= ''` guard makes this a safe no-op until the owner adds the
        # HEALTHCHECKS_PING_URL repo secret -- never fails the job either way
        # (bare curl failure here must not fail a real scrape).
        if: env.HEALTHCHECKS_PING_URL != ''
        run: curl -fsS -m 10 --retry 5 "$HEALTHCHECKS_PING_URL/start" || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        # playwright is NOT in requirements.txt -- it was moved to
        # requirements-optional.txt on 2026-08-12 because its only consumer
        # (page_flows.py's participant-flow scraper) feeds a write-only chain.
        # This step still needs it, so install it explicitly here rather than
        # pulling the whole optional file in (which would also drag in
        # scikit-learn/joblib for a killed model). Version matches the pin in
        # requirements-optional.txt.
        run: |
          pip install "playwright>=1.40.0"
          playwright install chromium --with-deps

      - name: Run daily update
        run: python main.py --update
        # --update: scrapes new dates since last DB record, then auto-saves trade setups

      - name: Health Check
        run: python health_check.py
        # E9: connection-is-real, staleness-chain, freshness-floor, flows T+2, rolling-trim sanity

      - name: Ping healthchecks.io (success)
        # TR-18 dead-man's-switch, part 2 of 3. Only reached if the update
        # AND the health check both succeeded. healthchecks.io is configured
        # (on its own side, not in this repo) as a Cron-schedule check
        # expecting this ping by 22:30 UTC weekdays with a 90-minute grace --
        # if it doesn't arrive, healthchecks.io alerts independently of
        # whether this job ran at all.
        if: success() && env.HEALTHCHECKS_PING_URL != ''
        run: curl -fsS -m 10 --retry 5 "$HEALTHCHECKS_PING_URL" || true

      - name: Notify on failure
        # TR-18 dead-man's-switch, part 3 of 3. Two independent signals so a
        # gap in one doesn't silence the other: /fail marks this run as a
        # known failure on healthchecks.io's own dashboard (distinct from a
        # plain missed ping), and the direct ntfy push puts a real error
        # message on the owner's phone immediately, without waiting on
        # healthchecks.io's grace window. Both guarded and best-effort --
        # must never mask the real job failure this step is reporting.
        if: failure()
        run: |
          echo "::error::Daily scraper FAILED on $(date -u '+%Y-%m-%d %H:%M UTC'). Check logs above."
          if [ -n "$HEALTHCHECKS_PING_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_PING_URL/fail" || true
          fi
          if [ -n "$NTFY_TOPIC" ]; then
            curl -fsS -m 10 \
              -H "Title: Kiran daily_scraper FAILED" \
              -H "Priority: high" \
              -H "Tags: warning" \
              -d "Run failed on $(date -u '+%Y-%m-%d %H:%M UTC'). Check GitHub Actions logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "https://ntfy.sh/$NTFY_TOPIC" || true
          fi