name: Weekly ML Retrain

# Scheduled trigger disabled 2026-07-31 — the model this trains
# (kiran_model.pkl) was killed (see docs/KIRAN_CLEANUP_AUDIT.md §14):
# coin-flip CV AUC, zero live consumers, and this workflow's own output
# was already disconnected from production (uploads a 30-day CI artifact,
# never commits back to the repo — kiran_model.pkl has been frozen since
# 2026-05-29 regardless of this schedule running weekly). Kept as a manual
# utility (workflow_dispatch only) rather than deleted.
on:
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # requirements-optional.txt is required here: scikit-learn and joblib
        # were moved out of requirements.txt on 2026-08-12 (the model this
        # workflow trains was killed 2026-07-31), and phase4_train.py cannot
        # run without them.
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-optional.txt

      - name: Train ML model
        run: python phase4_train.py
        # Reads backtest_setups from Supabase, trains model, saves .pkl file

      - name: Upload trained model as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiran-ml-model
          path: "*.pkl"
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: echo "::error::Weekly ML retrain FAILED on $(date -u '+%Y-%m-%d %H:%M UTC')."
