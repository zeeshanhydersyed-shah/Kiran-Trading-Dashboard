name: Weekly Portfolio Simulation

# Scheduled trigger disabled 2026-08-05 — kiran_sim.py replays the same
# active-trading, buy-on-strength/1%-risk mechanism as the "Active-trading
# simulation (kiran_sim)" study already Concluded — negative on 2026-05-12
# (RESEARCH_LOG.md: best case 7.45% CAGR vs ~22% KSE-100 buy-and-hold; that
# result is what drove the program's pivot to the Stage 2 portfolio
# approach). Dashboard's "Kiran Setup Simulation" section retired the same
# day (see docs/KIRAN_CLEANUP_AUDIT.md §19). Kept as a manual utility
# (workflow_dispatch only) rather than deleted.
on:
  workflow_dispatch:

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Kiran portfolio simulation
        run: python kiran_sim.py
        # Reads backtest_setups + prices from Supabase.
        # Writes sim_portfolio_trades table with equity curve and trade results.

      - name: Notify on failure
        if: failure()
        run: echo "::error::Weekly simulation FAILED on $(date -u '+%Y-%m-%d %H:%M UTC')."
