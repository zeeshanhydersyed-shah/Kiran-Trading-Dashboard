name: Weekly Portfolio Simulation

# Runs every Sunday after the backtest completes (backtest is at 08:00 UTC).
on:
  schedule:
    - cron: "0 9 * * 0"    # Sunday 09:00 UTC (backtest starts at 08:00)
  workflow_dispatch:

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Kiran portfolio simulation
        run: python kiran_sim.py
        # Reads backtest_setups + prices from Supabase.
        # Writes sim_portfolio_trades table with equity curve and trade results.

      - name: Notify on failure
        if: failure()
        run: echo "::error::Weekly simulation FAILED on $(date -u '+%Y-%m-%d %H:%M UTC')."
