[pytest]
# Only tests/ is a real suite. The 18 loose test_*.py files in the repo root
# are one-off research/verification scripts (see docs/KIRAN_CLEANUP_AUDIT.md
# §7.2) -- they are not pytest tests, several take minutes and hit the
# network or the production DB, and collecting them would make `pytest` at
# the repo root useless. Consolidating the salvageable ones into tests/ is
# still open work; until then this keeps the gate honest about what it runs.
testpaths = tests

# Fail on an unregistered marker rather than silently skipping the test.
addopts = -ra --strict-markers

filterwarnings =
    # pandas 2.x deprecation noise from sector_signals.py's fillna/ffill --
    # tracked separately, not something a test run should drown in.
    ignore::FutureWarning
